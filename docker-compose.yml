services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - machine-net
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - machine-net
networks:
  machine-net:
    driver: bridge
